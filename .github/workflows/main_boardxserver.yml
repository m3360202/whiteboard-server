# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - boardxserver

on:
  push:
    branches:
      - main3
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2


    - name: Setup Node.js 14
      uses: actions/setup-node@v2
      with:
        node-version: '14'
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://boardxcontainer.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_3177264e1bda4d5d84c2833623f3d79b }}
        password: ${{ secrets.AzureAppService_ContainerPassword_4fa09cf95b284348bd7d8e618913b764 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: boardxcontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_3177264e1bda4d5d84c2833623f3d79b }}/boardxserver:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'boardxserver'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_581c00e2ee5b4c2da8a8b51202f87719 }}
        images: 'boardxcontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_3177264e1bda4d5d84c2833623f3d79b }}/boardxserver:${{ github.sha }}'
